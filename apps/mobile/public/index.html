<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>دربنا</title>
    <meta name="theme-color" content="#070707" />
    <!-- iPhone: "Add to Home Screen" opens full-screen like an app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="apple-touch-icon" href="apple-touch-icon-gold.png" />
    <link rel="icon" type="image/png" href="favicon-gold.png" />
    <link rel="manifest" href="manifest.json" />
    <style id="expo-reset">
      html, body { height: 100%; margin: 0; background: #070707; }
      body { overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
      #root { display: flex; height: 100%; flex: 1; }
      
    </style>
  </head>
  <body>
    <noscript>دربنا يحتاج JavaScript. / Darbna needs JavaScript.</noscript>
    <div id="root"></div>
    <script>
      // Offline support (sw.js): the app and map areas you've seen keep working with no internet.
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
      }
    </script>
  </body>
</html>
