<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151515"/><stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6DC7A"/><stop offset="0.5" stop-color="#D4AF37"/><stop offset="1" stop-color="#9C7A1C"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g transform="translate(-133,30)">
  <!-- dark road sweeping toward the horizon, gold route along it -->
  <path d="M300 1024 C 380 760, 560 640, 600 470 L 690 470 C 690 650, 600 820, 700 1024 Z" fill="#232323"/>
  <path d="M500 1024 C 530 840, 600 700, 645 520" stroke="url(#gold)" stroke-width="26" fill="none" stroke-linecap="round" filter="url(#glow)"/>
  <!-- destination pin -->
  <path d="M645 170 c-105 0 -185 80 -185 182 c0 132 185 300 185 300 s185 -168 185 -300 c0 -102 -80 -182 -185 -182 z" fill="url(#gold)" filter="url(#glow)"/>
  <circle cx="645" cy="352" r="70" fill="#0A0907"/>
</g>
</svg>
