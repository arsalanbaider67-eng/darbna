name: Transcribe voice inbox
on:
  push:
    branches: [voice-inbox]
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null && pip install -q faster-whisper==1.0.3
      - run: |
          python - <<'PY'
          from faster_whisper import WhisperModel
          import glob
          m = WhisperModel("medium", device="cpu", compute_type="int8")
          for f in sorted(glob.glob("voice-inbox/*.mp3")):
              segs, _ = m.transcribe(f, language="ar", beam_size=5)
              print(f"::notice title={f}::" + " ".join(s.text for s in segs).strip())
          PY
