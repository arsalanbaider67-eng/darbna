# Real search requests across Iraq, per provider and for Darbna's own search engine.
# Writes docs/search-audit.md. Manual: Actions → "Search audit" → Run workflow.
name: Search audit

on:
  workflow_dispatch:
    inputs:
      engine:
        description: "Also test Darbna's own merged search (packages/core/src/search.ts)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ESRI_KEY: ${{ vars.ESRI_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build the search engine for Node
        if: inputs.engine
        run: npx -y esbuild@0.24.0 packages/core/src/search.ts --bundle --format=esm --platform=node --outfile=packages/core/dist-search/search.mjs
      - name: Audit
        run: node scripts/search-audit.mjs ${{ inputs.engine && '--engine-only' || '' }}
      - name: Save report
        run: |
          git config user.name github-actions; git config user.email actions@github.com
          git add docs/search-audit.md
          git diff --cached --quiet || { git commit -qm "Search audit report" && git pull -q --rebase && git push; }
