# Times the app's "nearby" (Overpass) lookups on the public server and mirrors. Read-only.
name: Overpass probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          OUT=""
          for host in https://overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter https://overpass.kumi.systems/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter; do
            for place in "41.725,44.775" "33.312,44.361" "36.191,44.009"; do
              for kind in 'nwr["amenity"="place_of_worship"]["religion"="muslim"](around:6000,P);' 'nwr["amenity"="fuel"](around:10000,P);'; do
                q="[out:json][timeout:8];(${kind//P/$place});out center tags 200;"
                r=$(curl -s -o /tmp/o.json -w "%{http_code} %{time_total}" -m 20 --data-urlencode "data=$q" "$host" || true)
                n=$(python3 -c "import json;print(len(json.load(open('/tmp/o.json')).get('elements',[])))" 2>/dev/null || echo "-")
                OUT="$OUT | $(echo $host | cut -d/ -f3) $place ${kind:0:20} -> $r n=$n"
              done
            done
          done
          echo "::notice title=overpass::$OUT"
