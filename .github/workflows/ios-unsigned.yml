# Builds an UNSIGNED iPhone app (.ipa) on GitHub's free macOS runners.
# Install it on your iPhone from Windows with Sideloadly (signs it with your Apple ID).
# Runs on every push that touches the app, or manually: Actions → "iOS test build" → Run workflow.
# Download the "Darbna-ios" artifact from the finished run, or the latest main build from the ios-build branch.
name: iOS test build

on:
  push:
    branches: [main]
    paths: ["apps/mobile/**", "packages/core/**", ".github/workflows/ios-unsigned.yml"]
  workflow_dispatch:
    inputs:
      api_url:
        description: "'direct' = works anywhere with public map services + shared reports (default); or your PC's Darbna server, e.g. http://192.168.100.100:8080"
        required: true
        default: "direct"

permissions:
  contents: write   # also saves the .ipa to the ios-build branch

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      EXPO_PUBLIC_API_URL: ${{ inputs.api_url || 'direct' }}
      # Public client values (Settings → Variables on GitHub); empty = reports stay on the phone.
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://dqkrjvdayekudacmmacf.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_KEY: ${{ vars.SUPABASE_KEY || 'sb_publishable_HL3RQnRh5psYp6y-7dDrUg_YzVu3AAn' }}
      EXPO_NO_METRO_WORKSPACE_ROOT: "1"
      CI: "1"
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install JS dependencies
        run: npm install --no-audit --no-fund

      - name: Generate iOS project
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --clean

      - name: Show app identity
        working-directory: apps/mobile/ios
        run: |
          WS=$(ls -d *.xcworkspace | head -1); NAME="${WS%.xcworkspace}"
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$NAME/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$NAME/Info.plist" || true

      - name: Build (unsigned, Release, device)
        working-directory: apps/mobile/ios
        run: |
          set -o pipefail
          xcodebuild \
            -workspace "$NAME.xcworkspace" -scheme "$NAME" \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log | grep -E "error:|warning: .*deprecated|\*\* BUILD" || true
          test -d "build/Build/Products/Release-iphoneos/$NAME.app" || { tail -200 xcodebuild.log; exit 1; }

      - name: Package .ipa
        working-directory: apps/mobile/ios
        run: |
          rm -rf Payload && mkdir Payload
          cp -R "build/Build/Products/Release-iphoneos/$NAME.app" Payload/
          zip -qry ../../../Darbna-unsigned.ipa Payload
          ls -lh ../../../Darbna-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Darbna-ios
          path: Darbna-unsigned.ipa
          retention-days: 14

      # Same file on the "ios-build" branch (one commit, replaced each time): a fixed download link
      # (github.com/<repo>/raw/ios-build/Darbna-unsigned.ipa) that doesn't expire after 14 days.
      - name: Save .ipa to the ios-build branch
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/ib && cd /tmp/ib && git init -q -b ios-build
          cp "$GITHUB_WORKSPACE/Darbna-unsigned.ipa" .
          printf 'Darbna iPhone test build\ncommit: %s\nbuilt: %s\n' "${{ github.sha }}" "$(date -u +%FT%TZ)" > BUILD.txt
          git add . && git -c user.name=github-actions -c user.email=actions@github.com commit -qm "iOS build ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ios-build

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: apps/mobile/ios/xcodebuild.log
          if-no-files-found: ignore
