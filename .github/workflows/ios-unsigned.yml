# Builds an UNSIGNED iPhone app (.ipa) on GitHub's free macOS runners.
# Install it on your iPhone from Windows with Sideloadly (signs it with your Apple ID).
# Runs on every push that touches the app, or manually: Actions → "iOS test build" → Run workflow.
# Download the "Darbna-ios" artifact from the finished run, or the latest main build from the ios-build branch.
name: iOS test build

on:
  push:
    branches: [main]
    paths: ["apps/mobile/**", "packages/core/**", ".github/workflows/ios-unsigned.yml"]
  workflow_dispatch:
    inputs:
      api_url:
        description: "'direct' = works anywhere with public map services + shared reports (default); or your PC's Darbna server, e.g. http://192.168.100.100:8080"
        required: true
        default: "direct"

permissions:
  contents: write   # also saves the .ipa to the ios-build branch

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      EXPO_PUBLIC_API_URL: ${{ inputs.api_url || 'direct' }}
      # Public client values (Settings → Variables on GitHub); empty = reports stay on the phone.
      # Own routing/search server (GitHub → Settings → Variables); empty = public OpenStreetMap services.
      EXPO_PUBLIC_ESRI_KEY: ${{ vars.ESRI_KEY }}   # licensed satellite imagery (ArcGIS Location Platform)
      EXPO_PUBLIC_ESRI_GEOCODE: ${{ vars.ESRI_GEOCODE }}   # 0 = no Esri place search
      EXPO_PUBLIC_VALHALLA_URL: ${{ vars.VALHALLA_URL }}
      EXPO_PUBLIC_NOMINATIM_URL: ${{ vars.NOMINATIM_URL }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://dqkrjvdayekudacmmacf.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_KEY: ${{ vars.SUPABASE_KEY || 'sb_publishable_HL3RQnRh5psYp6y-7dDrUg_YzVu3AAn' }}
      EXPO_NO_METRO_WORKSPACE_ROOT: "1"
      CI: "1"
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Select Xcode 26 (App Store requires the iOS 26 SDK since April 2026)
        run: |
          ls -d /Applications/Xcode_26*.app; X=$(ls -d /Applications/Xcode_26.[0-3]*.app 2>/dev/null | grep -vi -e beta -e rc | sort -V | tail -1); [ -n "$X" ] || X=$(ls -d /Applications/Xcode_26*.app | grep -vi -e beta -e rc | sort -V | tail -1); echo "::notice title=Xcode::$X"; sudo xcode-select -s "$X" && xcodebuild -version
          xcodebuild -version

      - name: Install JS dependencies
        run: npm install --no-audit --no-fund

      - name: Generate iOS project
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --clean

      - name: Patch fmt for Xcode 26.4+ (fmtlib/fmt#4740)
        working-directory: apps/mobile/ios
        run: |
          # React Native 0.81 pins fmt 11.0.2, whose consteval check fails with Apple clang 21.
          # Treat every Apple clang as "no consteval" (the fix upstream fmt 12.1 makes possible).
          F=Pods/fmt/include/fmt/base.h
          grep -q "__apple_build_version__ < 14000029L" "$F" || { echo "::error::fmt base.h pattern not found"; exit 1; }
          chmod u+w "$F"; sed -i '' 's/__apple_build_version__ < 14000029L/__apple_build_version__ > 0/' "$F"
          grep -n "__apple_build_version__" "$F"
      - name: App Store checks (privacy manifest, translated permission text, no test settings)
        working-directory: apps/mobile/ios
        run: |
          set -e
          PM=$(find . -name PrivacyInfo.xcprivacy -not -path "./Pods/*" -not -path "*Share*" -not -path "*Extension*" | head -1)
          [ -n "$PM" ] || { echo "::error::no PrivacyInfo.xcprivacy"; exit 1; }
          grep -q NSPrivacyCollectedDataTypePreciseLocation "$PM" && grep -q CA92.1 "$PM" || { echo "::error::privacy manifest incomplete"; cat "$PM"; exit 1; }
          echo "✓ $PM"
          for l in ar ckb en; do
            f=$(find . -path "*/$l.lproj/InfoPlist.strings" -not -path "./Pods/*" | head -1)
            [ -n "$f" ] && grep -q NSLocationWhenInUseUsageDescription "$f" || { echo "::error::missing $l.lproj/InfoPlist.strings"; exit 1; }
            echo "✓ $f"; grep NSLocationWhenInUseUsageDescription "$f" | cut -c1-120
          done
          PL=$(ls */Info.plist | head -1)
          if /usr/libexec/PlistBuddy -c "Print :NSAppTransportSecurity:NSAllowsArbitraryLoads" "$PL" 2>/dev/null | grep -q true; then echo "::warning::ATS exceptions on (test server build)"; else echo "✓ https only"; fi

      - name: Show app identity
        working-directory: apps/mobile/ios
        run: |
          WS=$(ls -d *.xcworkspace | head -1); NAME="${WS%.xcworkspace}"
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$NAME/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$NAME/Info.plist" || true

      - name: Build (unsigned, Release, device)
        working-directory: apps/mobile/ios
        run: |
          set -o pipefail
          xcodebuild \
            -workspace "$NAME.xcworkspace" -scheme "$NAME" \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log | grep -E "error:|warning: .*deprecated|\*\* BUILD" || true
          test -d "build/Build/Products/Release-iphoneos/$NAME.app" || { tail -200 xcodebuild.log; exit 1; }

      - name: Package .ipa
        working-directory: apps/mobile/ios
        run: |
          rm -rf Payload && mkdir Payload
          cp -R "build/Build/Products/Release-iphoneos/$NAME.app" Payload/
          zip -qry ../../../Darbna-unsigned.ipa Payload
          ls -lh ../../../Darbna-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Darbna-ios
          path: Darbna-unsigned.ipa
          retention-days: 14

      # Same file on the "ios-build" branch (one commit, replaced each time): a fixed download link
      # (github.com/<repo>/raw/ios-build/Darbna-unsigned.ipa) that doesn't expire after 14 days.
      - name: Save .ipa to the ios-build branch
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/ib && cd /tmp/ib && git init -q -b ios-build
          cp "$GITHUB_WORKSPACE/Darbna-unsigned.ipa" .
          printf 'Darbna iPhone test build\ncommit: %s\nbuilt: %s\n' "${{ github.sha }}" "$(date -u +%FT%TZ)" > BUILD.txt
          git add . && git -c user.name=github-actions -c user.email=actions@github.com commit -qm "iOS build ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ios-build

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: apps/mobile/ios/xcodebuild.log
          if-no-files-found: ignore
