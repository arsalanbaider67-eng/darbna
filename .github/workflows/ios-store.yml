# Builds the App Store version of Darbna, signs it and uploads it to App Store Connect
# (it then appears in TestFlight). Run it from GitHub → Actions → "iOS store build" → Run workflow.
# Needs 4 repository secrets from your Apple Developer account:
#   APPLE_TEAM_ID       (Membership details → Team ID, 10 characters)
#   ASC_KEY_ID          (App Store Connect → Users and Access → Integrations → keys → Key ID)
#   ASC_ISSUER_ID       (same page, "Issuer ID")
#   ASC_KEY_P8          (the whole text of the downloaded AuthKey_XXXX.p8 file; Admin access)
# Signing certificates and profiles are created automatically by Xcode with that key.
name: iOS store build

on:
  workflow_dispatch:
    inputs:
      share_extension:
        description: "Include the share extension (needs a registered iPhone for signing)"
        type: boolean
        default: false

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      EXPO_PUBLIC_API_URL: direct
      # Own routing/search server (GitHub → Settings → Variables); empty = public OpenStreetMap services.
      EXPO_PUBLIC_ESRI_KEY: ${{ vars.ESRI_KEY }}   # licensed satellite imagery (ArcGIS Location Platform)
      EXPO_PUBLIC_SUPPORT_PHONE: ${{ vars.SUPPORT_PHONE }}       # support phone for calls / prize claims (+964…)
      EXPO_PUBLIC_SUPPORT_WHATSAPP: ${{ vars.SUPPORT_WHATSAPP }} # support WhatsApp (defaults to the phone)
      EXPO_PUBLIC_ESRI_GEOCODE: ${{ vars.ESRI_GEOCODE }}   # 0 = no Esri place search
      EXPO_PUBLIC_VALHALLA_URL: ${{ vars.VALHALLA_URL }}
      EXPO_PUBLIC_NOMINATIM_URL: ${{ vars.NOMINATIM_URL }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://dqkrjvdayekudacmmacf.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_KEY: ${{ vars.SUPABASE_KEY || 'sb_publishable_HL3RQnRh5psYp6y-7dDrUg_YzVu3AAn' }}
      EXPO_NO_METRO_WORKSPACE_ROOT: "1"
      APP_BUILD_NUMBER: ${{ github.run_number }}
      DARBNA_SHARE_EXTENSION: ${{ inputs.share_extension && '1' || '0' }}
      EXPO_PUBLIC_SHARE_EXTENSION: ${{ inputs.share_extension && '1' || '0' }}
      CI: "1"
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4

      - name: Emergency numbers call-tested (release gate)
        run: node scripts/check-emergency-release.mjs

      - name: Licensed satellite imagery key
        run: |
          if [ -z "$EXPO_PUBLIC_ESRI_KEY" ]; then echo "::error title=ESRI_KEY missing::Add the GitHub variable ESRI_KEY (ArcGIS Location Platform API key); store builds must use licensed satellite imagery."; exit 1; fi

      - name: Check secrets
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          [ -n "$TEAM" ] || missing="$missing APPLE_TEAM_ID"
          [ -n "$KID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ISS" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$P8" ] || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then echo "::error title=missing secrets::Add these GitHub secrets first:$missing"; exit 1; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Select Xcode 26 (App Store requires the iOS 26 SDK since April 2026)
        run: ls -d /Applications/Xcode_26*.app; X=$(ls -d /Applications/Xcode_26.[0-3]*.app 2>/dev/null | grep -vi -e beta -e rc | sort -V | tail -1); [ -n "$X" ] || X=$(ls -d /Applications/Xcode_26*.app | grep -vi -e beta -e rc | sort -V | tail -1); echo "::notice title=Xcode::$X"; sudo xcode-select -s "$X" && xcodebuild -version

      - name: Install JS dependencies
        run: npm install --no-audit --no-fund

      - name: Leave out the share extension module (unless requested)
        if: ${{ !inputs.share_extension }}
        working-directory: apps/mobile
        run: |
          node -e 'const f="package.json",p=require("./"+f);p.expo=p.expo||{};p.expo.autolinking={...(p.expo.autolinking||{}),exclude:["expo-share-intent"]};require("fs").writeFileSync(f,JSON.stringify(p,null,2))'
          grep -n -A3 autolinking package.json
      - name: Generate iOS project
        working-directory: apps/mobile
        env:
          # Signing team goes into the app target only (app.config.ts → ios.appleTeamId), not the Pods.
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx expo prebuild --platform ios --clean

      - name: Patch fmt for Xcode 26.4+ (fmtlib/fmt#4740)
        working-directory: apps/mobile/ios
        run: |
          # React Native 0.81 pins fmt 11.0.2, whose consteval check fails with Apple clang 21.
          # Treat every Apple clang as "no consteval" (the fix upstream fmt 12.1 makes possible).
          F=Pods/fmt/include/fmt/base.h
          grep -q "__apple_build_version__ < 14000029L" "$F" || { echo "::error::fmt base.h pattern not found"; exit 1; }
          chmod u+w "$F"; sed -i '' 's/__apple_build_version__ < 14000029L/__apple_build_version__ > 0/' "$F"
          grep -n "__apple_build_version__" "$F"
      - name: App Store checks (privacy manifest, translated permission text)
        working-directory: apps/mobile/ios
        run: |
          set -e
          PM=$(find . -name PrivacyInfo.xcprivacy -not -path "./Pods/*" -not -path "*Share*" -not -path "*Extension*" | head -1)
          [ -n "$PM" ] || { echo "::error::no PrivacyInfo.xcprivacy"; exit 1; }
          grep -q NSPrivacyCollectedDataTypePreciseLocation "$PM" && grep -q CA92.1 "$PM" || { echo "::error::privacy manifest incomplete"; cat "$PM"; exit 1; }
          echo "✓ $PM"
          for l in ar ckb en; do
            f=$(find . -path "*/$l.lproj/InfoPlist.strings" -not -path "./Pods/*" | head -1)
            [ -n "$f" ] && grep -q NSLocationWhenInUseUsageDescription "$f" || { echo "::error::missing $l.lproj/InfoPlist.strings"; exit 1; }
            echo "✓ $f"; grep NSLocationWhenInUseUsageDescription "$f" | cut -c1-120
          done
          PL=$(ls */Info.plist | head -1)
          if /usr/libexec/PlistBuddy -c "Print :NSAppTransportSecurity:NSAllowsArbitraryLoads" "$PL" 2>/dev/null | grep -q true; then echo "::warning::ATS exceptions on (test server build)"; else echo "✓ https only"; fi

      - name: No test settings in the store build
        working-directory: apps/mobile/ios
        run: |
          PL=$(ls */Info.plist | grep -v Pods | head -1); echo "$PL"
          if /usr/libexec/PlistBuddy -c "Print :NSAppTransportSecurity:NSAllowsArbitraryLoads" "$PL" 2>/dev/null | grep -q true; then
            echo "::error title=test setting in store build::NSAllowsArbitraryLoads is on"; exit 1; fi
          if /usr/libexec/PlistBuddy -c "Print :NSLocalNetworkUsageDescription" "$PL" >/dev/null 2>&1; then
            echo "::error title=test setting in store build::NSLocalNetworkUsageDescription is present"; exit 1; fi
          echo "OK: https only, no local-network permission"

      - name: App Store Connect key
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$P8" > "$RUNNER_TEMP/asc/AuthKey.p8"

      # Without the share extension: archive unsigned (no registered iPhone needed); the export
      # below signs everything for the App Store with cloud signing.
      - name: Archive
        working-directory: apps/mobile/ios
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          WS=$(ls -d *.xcworkspace | head -1); NAME="${WS%.xcworkspace}"
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          if [ "$DARBNA_SHARE_EXTENSION" = "1" ]; then
            # With the share extension: sign at archive time (automatic, development profile for the
            # registered iPhone) so the App Group entitlement is kept; export re-signs for the App Store.
            # Team on every target of the app project (the Pods project is separate and untouched).
            perl -0pi -e "s/(buildSettings = \{\n)(?![^}]*DEVELOPMENT_TEAM)(?=[^}]*PRODUCT_BUNDLE_IDENTIFIER = \"?iq\.darbna\.app)/\$1\t\t\t\tDEVELOPMENT_TEAM = $TEAM;\n/g" "$NAME.xcodeproj/project.pbxproj"
            grep -c "DEVELOPMENT_TEAM = $TEAM" "$NAME.xcodeproj/project.pbxproj" | sed 's/^/::notice title=targets with team::/'
            xcodebuild -workspace "$NAME.xcworkspace" -scheme "$NAME" -configuration Release \
              -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Darbna.xcarchive" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS" \
              archive | tee archive.log | grep -E "error:|\*\* ARCHIVE" || true
          else
            xcodebuild -workspace "$NAME.xcworkspace" -scheme "$NAME" -configuration Release \
              -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Darbna.xcarchive" \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
              archive | tee archive.log | grep -E "error:|\*\* ARCHIVE" || true
          fi
          if [ ! -d "$RUNNER_TEMP/Darbna.xcarchive" ]; then
            # Errors as annotations, so they can be read without downloading the log.
            grep -E "(: error:|^error:|No profiles|No Account)" archive.log | grep -v "^ *\/Applications" | sort -u | head -25 | while IFS= read -r l; do echo "::error title=archive::${l:0:900}"; done
            tail -150 archive.log; exit 1
          fi

      - name: Upload to App Store Connect (TestFlight)
        working-directory: apps/mobile/ios
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          # 1) With the share extension: export a signed .ipa locally and check it kept its App Group.
          if [ "$DARBNA_SHARE_EXTENSION" = "1" ]; then
          sed 's#<string>upload</string>#<string>export</string>#' ExportOptions.plist > ExportLocal.plist
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Darbna.xcarchive" -exportOptionsPlist ExportLocal.plist \
            -exportPath "$RUNNER_TEMP/local" -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS" > export-local.log 2>&1 || true
          { grep -E "error:" export-local.log || true; } | sort -u | head -10 | while IFS= read -r l; do echo "::warning title=local export::${l:0:600}"; done
          IPA=$(ls "$RUNNER_TEMP"/local/*.ipa 2>/dev/null | head -1 || true)
          [ -n "$IPA" ] || tail -5 export-local.log | while IFS= read -r l; do echo "::warning title=local export (no ipa)::${l:0:600}"; done
          if [ -n "$IPA" ]; then
            mkdir -p "$RUNNER_TEMP/ipa" && (cd "$RUNNER_TEMP/ipa" && unzip -q -o "$IPA")
            for b in "$RUNNER_TEMP"/ipa/Payload/*.app "$RUNNER_TEMP"/ipa/Payload/*.app/PlugIns/*.appex; do
              [ -d "$b" ] || continue
              id=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$b/Info.plist")
              ent=$(codesign -d --entitlements :- "$b" 2>/dev/null | tr -d '\n\t ' | { grep -o 'application-groups</key><array><string>[^<]*' || true; } | sed 's/.*<string>//')
              echo "::notice title=signed $id::app group: ${ent:-none}"
            done
          fi
          fi
          # 2) Upload.
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Darbna.xcarchive" -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS" \
            | tee export.log | grep -E "error:|Upload|EXPORT" || true
          if ! grep -q "EXPORT SUCCEEDED\|Upload succeeded" export.log; then
            grep -iE "error|fail|invalid" export.log | sort -u | head -25 | while IFS= read -r l; do echo "::error title=upload::${l:0:900}"; done
            tail -80 export.log; exit 1
          fi
          echo "::notice title=uploaded::Build ${{ github.run_number }} sent to App Store Connect — it shows in TestFlight after Apple processes it (10–30 min)."

      - name: Clean up key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"

      - name: Logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-store-logs
          path: apps/mobile/ios/*.log
          if-no-files-found: ignore
