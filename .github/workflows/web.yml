# Builds the web preview of Darbna and publishes it on GitHub Pages:
#   https://<user>.github.io/<repo>/
# The web build needs no Darbna server ("direct" mode): routing, search and map tiles come
# straight from public OpenStreetMap services. TESTING ONLY — see apps/mobile/src/apiDirect.ts.
name: Web preview

on:
  push:
    branches: [main]
    paths: ["apps/mobile/**", "packages/core/**", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: write   # push the built site to the web-build branch (for inspection)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_PUBLIC_API_URL: direct
      EXPO_BASE_URL: /${{ github.event.repository.name }}
      EXPO_NO_METRO_WORKSPACE_ROOT: "1"
      NODE_ENV: production
      CI: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Align versions with Expo SDK
        working-directory: apps/mobile
        run: npx expo install --fix

      - name: Export web build
        working-directory: apps/mobile
        run: |
          npx expo export --platform web --output-dir dist
          ls -la dist
          grep -c "apple-mobile-web-app-capable" dist/index.html || echo "WARNING: custom index.html template not used"

      - name: Publish build to web-build branch (for inspection)
        working-directory: apps/mobile/dist
        run: |
          git init -q -b web-build
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          touch .nojekyll
          git add -A
          git commit -q -m "Web build ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" web-build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/mobile/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
