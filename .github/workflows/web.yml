# Builds the web preview of Darbna and publishes it on GitHub Pages:
#   https://<user>.github.io/<repo>/
# The web build needs no Darbna server ("direct" mode): routing, search and map tiles come
# straight from public OpenStreetMap services. TESTING ONLY — see apps/mobile/src/apiDirect.ts.
name: Web preview

on:
  push:
    branches: [main]
    paths: ["apps/mobile/**", "packages/core/**", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: write   # push the built site to the web-build branch (for inspection)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_PUBLIC_API_URL: direct
      # Public client values (Settings → Variables on GitHub); empty = reports stay on the phone.
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://dqkrjvdayekudacmmacf.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_KEY: ${{ vars.SUPABASE_KEY || 'sb_publishable_HL3RQnRh5psYp6y-7dDrUg_YzVu3AAn' }}
      EXPO_BASE_URL: /${{ github.event.repository.name }}
      EXPO_NO_METRO_WORKSPACE_ROOT: "1"
      NODE_ENV: production
      CI: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Check shared reports database (informational)
        continue-on-error: true
        run: |
          call() { curl -sS -m 15 -X POST "$EXPO_PUBLIC_SUPABASE_URL/rest/v1/rpc/$1" -H "apikey: $EXPO_PUBLIC_SUPABASE_KEY" \
                     -H "content-type: application/json" -d "$2" -w " [HTTP %{http_code}]"; }
          ID="ci-check-$GITHUB_RUN_ID-0000000000"
          echo "::notice title=reports::$(call darbna_reports '{"min_lng":44,"min_lat":33,"max_lng":45,"max_lat":34}' | head -c 300)"
          echo "::notice title=create::$(call darbna_create_report "{\"install\":\"$ID\",\"category\":\"pothole\",\"lng\":44.0001,\"lat\":33.0001}" | head -c 300)"
          echo "::notice title=traffic::$(call darbna_traffic '{"min_lng":44,"min_lat":33,"max_lng":45,"max_lat":34}' | head -c 200)"
          echo "::notice title=new-features::$(call darbna_me "{\"install\":\"$ID\"}" | head -c 200)"
          echo "::notice title=delete::$(call darbna_delete_me "{\"install\":\"$ID\"}" | head -c 300)"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Align versions with Expo SDK
        working-directory: apps/mobile
        run: |
          npx expo install --fix > fix.log 2>&1 || { echo "::error title=expo install --fix::$(tail -c 1500 fix.log | tr '\n' ' ')"; exit 1; }

      - name: Export web build
        working-directory: apps/mobile
        run: |
          node scripts/gen-web-icons.mjs
          npx expo export --platform web --output-dir dist
          ls -la dist
          grep -c "apple-mobile-web-app-capable" dist/index.html || echo "WARNING: custom index.html template not used"

      - name: Type check (report only)
        working-directory: apps/mobile
        continue-on-error: true
        run: |
          npx tsc --noEmit -p . > tsc.log 2>&1 && echo "::notice title=typecheck::no type errors" || grep -E "^src/" tsc.log | head -20 | while read -r l; do echo "::warning title=typecheck::$l"; done

      - name: Publish build to web-build branch (for inspection)
        working-directory: apps/mobile/dist
        run: |
          git init -q -b web-build
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          touch .nojekyll
          git add -A
          git commit -q -m "Web build ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" web-build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/mobile/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
