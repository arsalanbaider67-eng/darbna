# Checks a feature branch before it goes live: unit tests and a type check of the app.
# Nothing is built or published. Results show as annotations on the run.
name: Check branch

on:
  push:
    branches-ignore: [main, web-build, web-preview-wip]
  workflow_dispatch:

permissions:
  contents: write   # push the test build to the web-preview-wip branch

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_PUBLIC_API_URL: direct
      # Own routing/search server (GitHub → Settings → Variables); empty = public OpenStreetMap services.
      EXPO_PUBLIC_ESRI_KEY: ${{ vars.ESRI_KEY }}   # licensed satellite imagery (ArcGIS Location Platform)
      EXPO_PUBLIC_SUPPORT_PHONE: ${{ vars.SUPPORT_PHONE }}       # support phone for calls / prize claims (+964…)
      EXPO_PUBLIC_SUPPORT_WHATSAPP: ${{ vars.SUPPORT_WHATSAPP }} # support WhatsApp (defaults to the phone)
      EXPO_PUBLIC_ESRI_GEOCODE: ${{ vars.ESRI_GEOCODE }}   # 0 = no Esri place search
      EXPO_PUBLIC_VALHALLA_URL: ${{ vars.VALHALLA_URL }}
      EXPO_PUBLIC_NOMINATIM_URL: ${{ vars.NOMINATIM_URL }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://dqkrjvdayekudacmmacf.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_KEY: ${{ vars.SUPABASE_KEY || 'sb_publishable_HL3RQnRh5psYp6y-7dDrUg_YzVu3AAn' }}
      EXPO_BASE_URL: /darbna
      EXPO_NO_METRO_WORKSPACE_ROOT: "1"
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: |
          set +e
          npm install --no-audit --no-fund > /tmp/npm.log 2>&1; st=$?
          if [ $st != 0 ]; then grep -E "npm (error|ERR)|ERESOLVE|ETARGET|code " /tmp/npm.log | head -25 | while IFS= read -r l; do echo "::error title=npm install::${l:0:300}"; done; tail -5 /tmp/npm.log; fi
          exit $st
      - name: Only one React Native copy
        run: |
          n=$(find . -path "*/node_modules/react-native/package.json" -not -path "*/react-native/node_modules/*" | wc -l | tr -d ' ')
          [ "$n" = "1" ] || { find . -path "*/node_modules/react-native/package.json" -not -path "*/react-native/node_modules/*" | while read f; do echo "::error title=second React Native copy::$f"; done; exit 1; }
      - name: Core tests
        working-directory: packages/core
        run: bun test 2>&1 | tail -5
      - name: App tests
        working-directory: apps/mobile
        run: bun test 2>&1 | tail -5
      - name: Type check app
        working-directory: apps/mobile
        run: |
          if npx tsc --noEmit -p . > tsc.log 2>&1; then echo "::notice title=typecheck::no type errors"; else
            grep -E "^src/" tsc.log | head -40 | while read -r l; do echo "::warning title=typecheck::$l"; done; fi
      - name: Build web app for testing (not published)
        working-directory: apps/mobile
        run: |
          npx expo install --fix > fix.log 2>&1 || true
          cp ../../packages/core/data/emergency-numbers.json public/emergency-numbers.json  # updateable SOS numbers
          NODE_ENV=production node scripts/gen-web-icons.mjs
          NODE_ENV=production npx expo export --platform web --output-dir dist
      - name: Push test build to web-preview-wip branch
        working-directory: apps/mobile/dist
        run: |
          git init -q -b web-preview-wip
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Test build ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" web-preview-wip
