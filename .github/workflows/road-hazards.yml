# Speed bumps, speed cameras and traffic lights in Iraq from OpenStreetMap (ODbL), saved as
# packages/core/data/road-hazards.json for the app's map and "ahead" warnings.
# Runs monthly and manually (Actions → "Road hazards" → Run workflow).
name: Road hazards

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch from OpenStreetMap
        run: |
          # Two smaller queries over Iraq's bounding box (points outside Iraq are dropped next),
          # each tried on several servers, three rounds, so a busy server doesn't fail the run.
          get() {
            for round in 1 2 3; do
              for ep in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter https://overpass.private.coffee/api/interpreter; do
                curl -sS -m 600 -A "Darbna/1.0 (+https://github.com/arsalanbaider67-eng/darbna)" -H "Accept: application/json" \
                  --data-urlencode "data=$2" "$ep" -o "$1" && head -c 1 "$1" | grep -q "{" && { ls -la "$1"; return 0; }
              done
              sleep 60
            done
            echo "::warning title=overpass::$1 failed"; echo '{"elements":[]}' > "$1"
          }
          get a.json '[out:json][timeout:500][bbox:29.0,38.7,37.5,48.9];(node["traffic_calming"];node["highway"="speed_camera"];node["enforcement"="maxspeed"];relation["enforcement"="maxspeed"];);out center tags;'
          get b.json '[out:json][timeout:500][bbox:29.0,38.7,37.5,48.9];node["highway"="traffic_signals"];out;'
          python3 -c "import json;a=json.load(open('a.json'));b=json.load(open('b.json'));json.dump({'elements':a['elements']+b['elements']},open('raw.json','w'))"
      - name: Build road-hazards.json
        run: |
          python3 - <<'EOF'
          import json, datetime
          raw = open("raw.json").read()
          try: d = json.loads(raw)
          except Exception: print("::error title=overpass::" + raw[:400].replace("\n", " ")); raise
          # Keep only points inside Iraq (incl. the Kurdistan Region): same shapes as SOS regions.
          regs = json.load(open("packages/core/data/sos-regions.json"))["regions"]
          polys = [r for k, v in regs.items() if k in ("IQ", "IQ-KR") for r in v["outer"]]
          def inside(x, y):
              for ring in polys:
                  c = False; j = len(ring) - 1
                  for i in range(len(ring)):
                      xi, yi = ring[i]; xj, yj = ring[j]
                      if (yi > y) != (yj > y) and x < (xj - xi) * (y - yi) / (yj - yi) + xi: c = not c
                      j = i
                  if c: return True
              return False
          out, seen, counts = [], set(), {}
          for e in d.get("elements", []):
              t = e.get("tags", {})
              lat = e.get("lat", (e.get("center") or {}).get("lat")); lon = e.get("lon", (e.get("center") or {}).get("lon"))
              if lat is None or lon is None or not inside(lon, lat): continue
              if t.get("highway") == "speed_camera" or t.get("enforcement") == "maxspeed": kind = "camera"
              elif t.get("traffic_calming") in ("bump", "hump", "table", "cushion", "yes", "rumble_strip", "dip"): kind = "bump"
              elif t.get("highway") == "traffic_signals": kind = "signals"
              else: continue
              key = (kind, round(lat, 5), round(lon, 5))
              if key in seen: continue
              seen.add(key); counts[kind] = counts.get(kind, 0) + 1
              ms = t.get("maxspeed", "")
              row = [kind, round(lon, 6), round(lat, 6)]
              if kind == "camera" and ms.isdigit(): row.append(int(ms))
              out.append(row)
          # A query that failed leaves its kinds as they were last month.
          try: old = json.load(open("packages/core/data/road-hazards.json"))["items"]
          except Exception: old = []
          for kind in ("bump", "camera", "signals"):
              if not counts.get(kind):
                  keep = [r for r in old if r[0] == kind]; out += keep
                  if keep: counts[kind] = len(keep); print(f"::warning title=kept old::{kind} {len(keep)}")
          out.sort()
          doc = {"source": "© OpenStreetMap contributors, ODbL", "fetched": datetime.date.today().isoformat(), "counts": counts, "items": out}
          json.dump(doc, open("packages/core/data/road-hazards.json", "w"), separators=(",", ":"))
          print(counts)
          print(f"::notice title=road hazards::{counts}")
          EOF
      - name: Commit
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add packages/core/data/road-hazards.json
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -qm "Road hazards from OpenStreetMap (speed bumps, cameras)" && git push
