name: Iraqi voice pronunciation review
on:
  workflow_dispatch:
    inputs:
      full_pack:
        description: "Generate all Arabic prompts instead of the eight review samples"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: iraqi-voice-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audio tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Record isolated Sufyan candidates
        working-directory: apps/mobile
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          VOICE_PHRASES_FILE: assets/voice/iraqi-review.json
          VOICE_REVIEW_DIR: voice-review
          VOICE_KEYS: mv_right,mv_left,mv_roundabout_plain,mv_roundabout_1,mv_roundabout_2,mv_roundabout_exit,d_200m,then
          FULL_PACK: ${{ inputs.full_pack }}
        run: |
          if [ "$FULL_PACK" = "true" ]; then unset VOICE_KEYS; fi
          node scripts/gen-voice.mjs
      - name: Build listening comparison
        if: always()
        working-directory: apps/mobile
        env:
          VOICE_REVIEW_DIR: voice-review
        run: node scripts/gen-voice-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iraqi-voice-listening-review
          path: apps/mobile/voice-review
