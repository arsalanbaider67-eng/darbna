# Transcribes every recorded guidance clip with Whisper and reports any clip whose words don't
# match its phrase (catches mis-cut recordings). Manual, or when the clips change.
name: Check voice clips

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["apps/mobile/assets/voice/ar/**", "apps/mobile/assets/voice/en/**", ".github/workflows/voice-check.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Whisper
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q faster-whisper==1.0.3
      - name: Transcribe and compare
        working-directory: apps/mobile
        run: python ../../scripts/check_voice_clips.py
