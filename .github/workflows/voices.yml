# Preview review only. Never commits audio or updates production.
name: Record voices
on:
  workflow_dispatch:
    inputs:
      full_pack:
        description: "Record all 75 Modern Standard Arabic prompts"
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: standard-arabic-voice-review
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audio tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Select male Modern Standard Arabic voice
        working-directory: apps/mobile
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: node scripts/select-standard-arabic-voice.mjs
      - name: Record standard Arabic preview
        working-directory: apps/mobile
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          VOICE_PHRASES_FILE: assets/voice/standard-arabic-review.json
          VOICE_REVIEW_DIR: voice-review-standard
          VOICE_KEYS: mv_right,mv_left,mv_roundabout_plain,mv_roundabout_1,mv_roundabout_2,mv_roundabout_exit,d_200m,then
          FULL_PACK: ${{ inputs.full_pack }}
        run: |
          if [ "$FULL_PACK" = "true" ]; then unset VOICE_KEYS; fi
          node scripts/gen-voice.mjs
      - name: Build listening comparison
        if: always()
        working-directory: apps/mobile
        env:
          VOICE_PHRASES_FILE: assets/voice/standard-arabic-review.json
          VOICE_REVIEW_DIR: voice-review-standard
        run: node scripts/gen-voice-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: standard-arabic-voice-review
          path: apps/mobile/voice-review-standard
