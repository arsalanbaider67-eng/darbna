# Records the guidance voice prompts with Azure voices (see assets/voice/phrases.json) and commits them.
# Needs repository secrets: AZURE_SPEECH_KEY, AZURE_SPEECH_REGION (Azure voices), ELEVENLABS_API_KEY (ElevenLabs voices: Arabic Sufyan, English Aaden). Runs when the phrase list changes, or manually from the Actions tab.
name: Record voices

# Manual only: the current voices were recorded on the website (Eleven v3, Generation 2) and must
# not be overwritten automatically.
on:
  workflow_dispatch:
    inputs:
      iraqi_review:
        description: "Generate eight isolated Iraqi pronunciation samples (no active recordings replaced)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: voices
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audio tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null

      - name: Record prompts
        if: ${{ !inputs.iraqi_review }}
        working-directory: apps/mobile
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: node scripts/gen-voice.mjs
      - name: Commit recordings
        if: ${{ !inputs.iraqi_review }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add apps/mobile/assets/voice apps/mobile/src/nav/voiceClips.ts
          if git diff --cached --quiet; then echo "::notice title=voices::nothing new to commit"; exit 0; fi
          git commit -q -m "Record guidance voice prompts"
          git push
      - name: Record isolated Iraqi review
        if: ${{ inputs.iraqi_review }}
        working-directory: apps/mobile
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          VOICE_PHRASES_FILE: assets/voice/iraqi-review.json
          VOICE_REVIEW_DIR: voice-review
          VOICE_KEYS: mv_right,mv_left,mv_roundabout_plain,mv_roundabout_1,mv_roundabout_2,mv_roundabout_exit,d_200m,then
        run: node scripts/gen-voice.mjs
      - name: Build listening comparison
        if: ${{ always() && inputs.iraqi_review }}
        working-directory: apps/mobile
        env:
          VOICE_REVIEW_DIR: voice-review
        run: node scripts/gen-voice-review.mjs
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.iraqi_review }}
        with:
          name: iraqi-voice-listening-review
          path: apps/mobile/voice-review
