# One-off helper: downloads reference data that the dev environment can't reach directly
# (administrative boundaries and official emergency-number pages) and pushes it to the
# "data-sources" branch for review. Nothing here ships in the app by itself.
name: Fetch reference data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download
        run: |
          mkdir -p out/bounds out/pages
          cd out/bounds
          for c in IRQ TUR IRN SYR JOR SAU KWT GEO; do
            for lvl in ADM0 ADM1; do
              meta=$(curl -sSL -m 60 "https://www.geoboundaries.org/api/current/gbOpen/$c/$lvl/" || true)
              echo "$meta" > "$c-$lvl.meta.json"
              url=$(echo "$meta" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("gjDownloadURL",""))' 2>/dev/null || true)
              surl=$(echo "$meta" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("simplifiedGeometryGeoJSON",""))' 2>/dev/null || true)
              if [ "$c" = "IRQ" ] && [ -n "$url" ]; then curl -sSL -m 300 "$url" -o "$c-$lvl.geojson" || true; fi
              if [ -n "$surl" ]; then curl -sSL -m 300 "$surl" -o "$c-$lvl.simplified.geojson" || true; fi
            done
          done
          ls -la
          # OpenStreetMap boundaries (more detailed): Iraq's governorates, the Kurdistan Region, Iraq itself.
          ovp() {
            for ep in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter; do
              curl -sS -m 600 -A "Darbna/1.0 (+https://github.com/arsalanbaider67-eng/darbna)" -H "Accept: application/json" \
                --data-urlencode "data=$2" "$ep" -o "$1" && head -c 1 "$1" | grep -q "{" && break
            done
            ls -la "$1"
          }
          ovp osm-irq-gov.json '[out:json][timeout:500];relation["boundary"="administrative"]["admin_level"="4"]["ISO3166-2"~"^IQ-"];out geom;'
          ovp osm-kri.json '[out:json][timeout:300];relation["boundary"="administrative"]["admin_level"="3"]["ISO3166-2"="IQ-KR"];out geom;'
          ovp osm-kri-any.json '[out:json][timeout:300];area["ISO3166-1"="IQ"]->.a;relation(area.a)["boundary"="administrative"]["admin_level"="3"];out tags;'
          ovp osm-irq.json '[out:json][timeout:500];relation["boundary"="administrative"]["admin_level"="2"]["ISO3166-1"="IQ"];out geom;'
          cd ../pages
          get() { curl -sSL -m 60 -A "Mozilla/5.0 (Darbna reference check)" "$2" -o "$1.html" || echo "FAILED $2" > "$1.html"; }
          get krd-help-numbers "https://help.krd/?id=6&lang=en"
          get krd-erbil-122 "https://gov.krd/dmi-en/activities/news-and-press-releases/2023/january/erbil-s-emergency-line-122-fast-and-free-help-to-all/"
          get erbil-gov "https://erbil.gov.krd/"
          get ina-911-5langs "https://ina.iq/en/local/37665-interior-ministry-911-receives-calls-in-5-languages.html"
          get ina-911-visitors "https://ina.iq/en/local/50621-moi-instant-translation-in-six-languages-for-communication-with-visitors-via-911.html"
          get moi-iq "https://moi.gov.iq/"
          get georgia-112 "https://112.gov.ge/en/"
          get kuwait-egov "https://e.gov.kw/sites/kgoenglish/Pages/Visitors/TourismInKuwait/EssintialServicesEmergencies.aspx"
          get turkey-112 "https://www.112.gov.tr/"
          get jordan-psd "https://psd.gov.jo/en-us/"
          get saudi-911 "https://www.my.gov.sa/en/content/emergency-numbers"
          ls -la
      - name: Probe place-search services (CORS + speed) from a browser-like request
        run: |
          mkdir -p out/probe; cd out/probe
          Q='[out:json][timeout:8];(nwr["amenity"="place_of_worship"]["religion"="muslim"](around:6000,41.7151,44.7930););out center tags 200;'
          for ep in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter https://overpass.private.coffee/api/interpreter; do
            curl -s -m 15 -o body.json -D hdr.txt -w "%{http_code} %{time_total}s" -A "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Safari/604.1" \
              -H "Origin: https://arsalanbaider67-eng.github.io" --data-urlencode "data=$Q" "$ep" > res.txt || true
            echo "$ep → $(cat res.txt) acao=$(grep -i '^access-control-allow-origin' hdr.txt | tr -d '\r') elements=$(python3 -c 'import json;print(len(json.load(open("body.json")).get("elements",[])))' 2>/dev/null)" >> probe.txt
          done
          curl -s -m 15 -o nom.json -D nomh.txt -w "%{http_code} %{time_total}s" -A "Mozilla/5.0 (iPhone)" -H "Origin: https://arsalanbaider67-eng.github.io" \
            "https://nominatim.openstreetmap.org/search?q=mosque&format=jsonv2&limit=30&bounded=1&viewbox=44.67,41.83,44.91,41.59" > res.txt || true
          echo "nominatim → $(cat res.txt) acao=$(grep -i '^access-control-allow-origin' nomh.txt | tr -d '\r') results=$(python3 -c 'import json;print(len(json.load(open("nom.json"))))' 2>/dev/null)" >> probe.txt
          cat probe.txt
          echo "::notice title=probe::$(tr '\n' ' | ' < probe.txt)"

      - name: Push to data-sources branch
        run: |
          cd out
          git init -q -b data-sources
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Reference data $(date -u +%F)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" data-sources
