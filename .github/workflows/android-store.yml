# Builds the Google Play version of Darbna (.aab), signed with your upload key.
# Run it from GitHub → Actions → "Android store build" → Run workflow, then download the
# "Darbna-android" artifact and upload the .aab in Play Console (the first upload is manual).
# Needs 4 repository secrets: ANDROID_UPLOAD_KEYSTORE_BASE64, ANDROID_UPLOAD_STORE_PASSWORD,
# ANDROID_UPLOAD_KEY_ALIAS, ANDROID_UPLOAD_KEY_PASSWORD. Without them it builds a test APK only.
name: Android store build

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPO_PUBLIC_API_URL: direct
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://dqkrjvdayekudacmmacf.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_KEY: ${{ vars.SUPABASE_KEY || 'sb_publishable_HL3RQnRh5psYp6y-7dDrUg_YzVu3AAn' }}
      EXPO_NO_METRO_WORKSPACE_ROOT: "1"
      APP_BUILD_NUMBER: ${{ github.run_number }}
      CI: "1"
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4

      - name: Emergency numbers call-tested (release gate)
        run: node scripts/check-emergency-release.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install JS dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean

      # Caches Gradle downloads/builds between runs (the android/ project exists only after prebuild).
      - uses: gradle/actions/setup-gradle@v4

      - name: Upload key
        id: key
        env:
          KS: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "signed=1" >> "$GITHUB_OUTPUT"
            echo "::notice title=signing::Signed with your upload key"
          else
            echo "signed=0" >> "$GITHUB_OUTPUT"
            echo "::warning title=signing::No upload key secrets yet: building a test APK only (not for Google Play)"
          fi

      - name: Build
        working-directory: apps/mobile/android
        env:
          DARBNA_UPLOAD_STORE_FILE: ${{ steps.key.outputs.signed == '1' && format('{0}/upload.jks', runner.temp) || '' }}
          DARBNA_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          DARBNA_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          DARBNA_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ "${{ steps.key.outputs.signed }}" = "1" ]; then
            ./gradlew --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a bundleRelease
            cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/Darbna-${{ github.run_number }}.aab"
          else
            ./gradlew --no-daemon -PreactNativeArchitectures=arm64-v8a assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Darbna-test-${{ github.run_number }}.apk"
          fi
          rm -f "$RUNNER_TEMP/upload.jks"
          ls -lh "$GITHUB_WORKSPACE"/Darbna-*

      - uses: actions/upload-artifact@v4
        with:
          name: Darbna-android
          path: |
            Darbna-*.aab
            Darbna-*.apk
          retention-days: 30
