# Darbna's own routing + search server for darbna.com (used by the app in "direct" mode).
#   routing.darbna.com → Valhalla (car + walking routes, speed limits)
#   search.darbna.com  → Nominatim (address / place search, "nearby fuel" etc.)
# Map tiles stay on OpenFreeMap and shared reports on Supabase, so this is all the app needs.
# Deployed by .github/workflows/server-deploy.yml into /opt/darbna on the VPS:
#   docker compose -f docker-compose.darbna.yml --env-file .env up -d
# First start downloads the Iraq map (Geofabrik) and builds both indexes.
# Readiness depends on the actual import; verify both services before switching the app.
name: darbna

services:
  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted@sha256:c58f9d72ab8c99453dad83da8f0c3df483a1f577243d54d43d9dd1443de1dac5
    environment:
      tile_urls: https://download.geofabrik.de/asia/iraq-latest.osm.pbf
      serve_tiles: "True"
      build_elevation: "False"
      build_admins: "True"
      build_time_zones: "True"
      use_tiles_ignore_pbf: "True"
      # Set REBUILD_ROUTING=True in .env (the deploy workflow's "refresh map data" option) to pick up new OSM edits.
      force_rebuild: ${REBUILD_ROUTING:-False}
      server_threads: "4"
    volumes: [valhalla:/custom_files]
    # The routing server writes HTTP request targets to stdout.
    logging: { driver: none }
    restart: unless-stopped

  nominatim:
    image: mediagis/nominatim@sha256:7923a8e67197fc6d4f4ecb7c0e8bbedffeddcfdf4519596fe946e46a28f5a9f8
    environment:
      PBF_URL: https://download.geofabrik.de/asia/iraq-latest.osm.pbf
      REPLICATION_URL: https://download.geofabrik.de/asia/iraq-updates/
      UPDATE_MODE: continuous          # keeps search up to date with OpenStreetMap edits
      IMPORT_STYLE: full
      THREADS: "2"
      GUNICORN_WORKERS: "2"
      POSTGRES_SHARED_BUFFERS: 1GB
      POSTGRES_MAINTENANCE_WORK_MEM: 2GB
      POSTGRES_AUTOVACUUM_WORK_MEM: 256MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 4GB
      NOMINATIM_PASSWORD: ${NOMINATIM_DB_PASSWORD:?set NOMINATIM_DB_PASSWORD}
    shm_size: 1gb
    volumes: [nominatim:/var/lib/postgresql/16/main]
    logging: { driver: none }
    restart: unless-stopped

  caddy:
    image: caddy@sha256:685ae3d7c34d9b5f8caeddc5d14051db7bbd88ff1f5a2fa0c16bd8ca328fb7af
    ports: ["80:80", "443:443"]
    volumes: ["./Caddyfile.darbna:/etc/caddy/Caddyfile:ro", "caddy:/data"]
    depends_on: [valhalla, nominatim]
    logging:
      driver: local
      options: { max-size: 5m, max-file: "2" }
    restart: unless-stopped

volumes: { valhalla: {}, nominatim: {}, caddy: {} }
